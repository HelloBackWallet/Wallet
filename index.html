<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloBack Wallet - Soberana</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .profile-icon {
            background: #1a1a24;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .tab {
            background: #1a1a24;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #a0a0b0;
            white-space: nowrap;
        }
        .tab.active {
            background: #ab9ff2;
            color: #0b0b0e;
            font-weight: bold;
        }
        .card-box {
            background: linear-gradient(135deg, #2b2348, #151324);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            margin-top: 20px;
            border: 1px solid #3d3463;
        }
        .card-title {
            color: #a0a0b0;
            font-size: 14px;
        }
        .card-balance {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn-main {
            background: #ab9ff2;
            color: #0b0b0e;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
        .section-title {
            font-size: 16px;
            margin: 24px 0 12px 0;
            color: #a0a0b0;
        }
        .token-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .token-item {
            background: #151324;
            padding: 12px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1a1a24;
        }
        .token-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .token-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2b2348;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Cabecera estilo Phantom -->
    <div class="header">
        <div class="profile-icon">😎</div>
        <div style="font-weight: bold;">@HelloBack</div>
        <div>⚙️</div>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="nav-tabs">
        <div class="tab active">Inicio</div>
        <div class="tab">Tarjetita Privada</div>
        <div class="tab">P2P Ciego</div>
        <div class="tab">Ajustes</div>
    </div>

    <!-- Saldo de la Tarjeta Interna (Ciego y Respaldo) -->
    <div class="card-box">
        <div class="card-title">Saldo Interno Limpio</div>
        <div class="card-balance">$0.00</div>
        <div style="font-size: 12px; color: #4ade80;">● Respaldo Cripto Activo (Sin Rastreo)</div>
    </div>

    <!-- Botón de Conversión / Acciones -->
    <button class="btn-main">Convertir / Enviar Anónimo</button>

    <!-- Lista Exclusiva de Monedas Permitidas -->
    <div class="section-title">Activos Autorizados</div>
    <div class="token-list">
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="color: #26a17b;">₮</div>
                <div><b>USDT</b><div style="font-size: 12px; color: #a0a0b0;">Tether</div></div>
            </div>
            <div>$0.00</div>
        </div>
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="color: #2775ca;">🅲</div>
                <div><b>USDC</b><div style="font-size: 12px; color: #a0a0b0;">USD Coin</div></div>
            </div>
            <div>$0.00</div>
        </div>
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="color: #f7931a;">₿</div>
                <div><b>Bitcoin</b><div style="font-size: 12px; color: #a0a0b0;">BTC</div></div>
            </div>
            <div>$0.00</div>
        </div>
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="color: #ff6600;">ɱ</div>
                <div><b>Monero</b><div style="font-size: 12px; color: #a0a0b0;">XMR</div></div>
            </div>
            <div>$0.00</div>
        </div>
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="color: #14f195;">◎</div>
                <div><b>Solana</b><div style="font-size: 12px; color: #a0a0b0;">SOL</div></div>
            </div>
            <div>$0.00</div>
        </div>
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="color: #627eea;">Ξ</div>
                <div><b>Ethereum</b><div style="font-size: 12px; color: #a0a0b0;">ETH</div></div>
            </div>
            <div>$0.00</div>
        </div>
    </div>

</body>
</html>
